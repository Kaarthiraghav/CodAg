[models]
main      = "qwen3.5:9b"
embedding = "nomic-embed-text"
coder     = "qwen3.5:9b"

[ollama]
host       = "http://localhost:11434"
keep_alive = "15m"

[gemini]
enabled         = true
model           = "gemini-3.5-flash"
fallback_models = ["gemini-3.5-flash-lite", "gemini-3.7-flash", "gemini-3.1-flash-lite", "gemini-3.8-flash"]
api_key_env     = "GEMINI_API_KEY"

[orchestrator]
mode                     = "auto"
planning_skills          = ["code_plan", "router"]
heavy_skills             = ["code_exec", "code", "files", "shell", "web", "custom_skills", "knowledge"]
light_max_chars          = 10000
prefer_local_for_private = true

[main]
temperature = 0.3
num_ctx     = 8192
think       = false

[limits]
max_model_calls_per_turn = 8
max_tool_calls_per_turn  = 12
tool_result_max_chars    = 6000
command_timeout_s        = 60

[paths]
data_dir = "~/.codag"

[web]
enabled         = true
search_provider = "duckduckgo"
fetch_max_bytes = 2000000
