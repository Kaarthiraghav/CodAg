[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codag"
version = "0.2.0"
description = "Local general-purpose personal assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.4.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "chromadb>=0.4.0",
    "trafilatura>=2.0.0",
    "ddgs>=9.0.0",
    "apscheduler>=3.10.0",
    "reportlab>=4.0.0",
    "pypdf>=5.0.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
codag = "codag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
