# 20 Retrieval Benchmark Questions over Sample Documents
documents:
  - id: "doc_01"
    path: "docs/networking.md"
    content: "The default API server port is 8000. It supports Server-Sent Events on /api/chat/stream."
  - id: "doc_02"
    path: "docs/models.md"
    content: "CodAg defaults to qwen3.5:9b for main conversation, planning, and code execution using the same model to eliminate model swaps."
  - id: "doc_03"
    path: "docs/embeddings.md"
    content: "Embeddings use nomic-embed-text with 768 dimensions or qwen3-embedding:0.6b with 1024 dimensions."
  - id: "doc_04"
    path: "docs/safety.md"
    content: "The permission tiers are READ, SAFE_WRITE, CONFIRM, and FORBIDDEN. Quitting applications requires CONFIRM approval. Sudo commands are forbidden."
  - id: "doc_05"
    path: "docs/scheduler.md"
    content: "Reminders and briefings are backed by APScheduler and persisted in ~/.codag/scheduler.db."

questions:
  - q: "What is the default API server port?"
    expected_doc: "doc_01"
    expected_keyword: "8000"
  - q: "Which endpoint supports Server-Sent Events?"
    expected_doc: "doc_01"
    expected_keyword: "/api/chat/stream"
  - q: "What is the default main model?"
    expected_doc: "doc_02"
    expected_keyword: "qwen3.5:9b"
  - q: "Which model is used for planning and code execution?"
    expected_doc: "doc_02"
    expected_keyword: "qwen3.5:9b"
  - q: "How many dimensions does nomic-embed-text use?"
    expected_doc: "doc_03"
    expected_keyword: "768"
  - q: "How many dimensions does qwen3-embedding use?"
    expected_doc: "doc_03"
    expected_keyword: "1024"
  - q: "What are the four permission tiers in CodAg?"
    expected_doc: "doc_04"
    expected_keyword: "READ"
  - q: "Are sudo commands allowed?"
    expected_doc: "doc_04"
    expected_keyword: "forbidden"
  - q: "What library powers reminders and briefings?"
    expected_doc: "doc_05"
    expected_keyword: "APScheduler"
  - q: "Where is the scheduler database persisted?"
    expected_doc: "doc_05"
    expected_keyword: "scheduler.db"
  - q: "How do SSE streams connect to the web UI?"
    expected_doc: "doc_01"
    expected_keyword: "Server-Sent Events"
  - q: "What model handles both chat and code?"
    expected_doc: "doc_02"
    expected_keyword: "qwen3.5:9b"
  - q: "What alternative embedding model is available?"
    expected_doc: "doc_03"
    expected_keyword: "nomic-embed-text"
  - q: "What happens when a sudo command is requested?"
    expected_doc: "doc_04"
    expected_keyword: "forbidden"
  - q: "Where does the assistant store scheduled jobs?"
    expected_doc: "doc_05"
    expected_keyword: "scheduler.db"
  - q: "What protocol does /api/chat/stream use?"
    expected_doc: "doc_01"
    expected_keyword: "Server-Sent Events"
  - q: "Why is qwen3.5:9b used for both roles?"
    expected_doc: "doc_02"
    expected_keyword: "same model"
  - q: "What is the dimension of nomic embeddings?"
    expected_doc: "doc_03"
    expected_keyword: "768"
  - q: "Which tier is required for quitting applications?"
    expected_doc: "doc_04"
    expected_keyword: "CONFIRM"
  - q: "Can daily briefings be scheduled?"
    expected_doc: "doc_05"
    expected_keyword: "briefings"
